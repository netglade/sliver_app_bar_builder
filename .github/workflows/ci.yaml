name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The `flutter-actions/setup-fvm` action is documented as not working, so
      # FVM is installed with the official script (into ~/fvm/bin, no sudo).
      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash -s -- 4.1.0
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm/versions
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}

      # Installs the Flutter version pinned in .fvmrc and links .fvm/flutter_sdk,
      # which is what Melos uses as its sdkPath.
      - name: Install Flutter
        run: fvm install --skip-pub-get

      # Resolves the root package and, through the Flutter tool, `example`.
      - name: Install Dependencies
        run: fvm flutter pub get

      - name: Format
        run: fvm dart run melos run lint:format

      - name: Flutter Analyze
        run: fvm dart run melos run lint:dart

      # Installs the DCM version pinned in dcm_global.yaml.
      - name: Install DCM
        uses: CQLabs/setup-dcm@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: auto

      - name: Run DCM
        env:
          DCM_CI_KEY: ${{ secrets.DCM_KEY }}
          DCM_EMAIL: ${{ secrets.DCM_EMAIL }}
        run: fvm dart run melos run lint:dcm

      - name: Test
        run: fvm dart run melos run test

      - name: Dry Publish
        run: fvm dart pub publish --dry-run
