# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # The `flutter-actions/setup-fvm` action is documented as not working, so
      # FVM is installed with the official script (into ~/fvm/bin, no sudo).
      - name: Install FVM
        run: |
          curl -fsSL https://fvm.app/install.sh | bash -s -- 4.1.0
          echo "$HOME/fvm/bin" >> "$GITHUB_PATH"

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/fvm/versions
          key: fvm-${{ runner.os }}-${{ hashFiles('.fvmrc') }}

      # Installs the Flutter version pinned in .fvmrc; `example` has no config of
      # its own, so FVM resolves the repository root one.
      - name: Install Flutter
        run: fvm install --skip-pub-get

      - name: Build Storybook for Web
        working-directory: ./example
        run: fvm flutter build web --base-href "/sliver_app_bar_builder/"

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'example/build/web/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
